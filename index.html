function p1c(x){if(!D1.ok||!x||!x.c1)return null;var k=D1.who[String(x.c1).trim().replace(/^0+/,'')];return k===undefined?null:D1.prof[k]}
var _dOf1=dOf;
dOf=function(id){if(s.inst&&me){var m=p1c(me);if(m){var b=(m[id]||0)+abonus(me.id);return Math.min(90,Math.round(b*100)/100)}}return _dOf1(id)};
var _pr1=pr;
pr=function(g){if(s.inst&&me&&p1c(me)){var b=Math.round(g[5]*(1-dOf(g[0])/100));if(g[0]===dealId())b=Math.round(b*.95);return b}return _pr1(g)};
var _admCard1=admCard;
admCard=function(x,i){var h=_admCard1(x,i),m=p1c(x);
 var info=x.c1?(m?'✅ Цены по скидкам из 1С (код контрагента '+esc(x.c1)+')':(D1.ok?'⚠ Код '+esc(x.c1)+' не найден в скидках 1С':'Скидки из 1С загружаются…')):'Не привязан к 1С — действует скидка по умолчанию';
 if(m)h=h.replace(/Скидка итого<\/div><b>[^<]*/,'Скидка</div><b>из 1С'+(abonus(x.id)?' +'+abonus(x.id)+'%':''));
 var row=`<div class='row' style='flex-wrap:nowrap'><span class='mut' style='white-space:nowrap'>Код в 1С</span><input type='text' inputmode='numeric' id='c1-${x.id}' value='${esc(x.c1||'')}' placeholder='код контрагента' style='width:100%'><button class='btn' data-a='ac1' data-id='${x.id}'>Привязать</button></div><div class='mut' style='font-size:13px;margin:4px 0 8px'>${info}</div>`;
 return h.replace("<div class='dv' style='margin:10px 0'></div>","<div class='dv' style='margin:10px 0'></div>"+row)};
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-a=ac1]');if(!a)return;var id=a.dataset.id,x=INSTALLERS.filter(function(q){return q.id===id})[0],el=$('c1-'+id);if(!x||!el)return;x.c1=el.value.trim();pins();toast(x.c1?(p1c(x)?'Привязан к 1С: скидки из 1С':'Код сохранён'+(D1.ok?', но в скидках 1С не найден':'')):'Привязка к 1С снята');render(true)});
if(/^https?:/.test(location.protocol))fetch('discounts.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d)applyDisc(d)}).catch(function(){});

/* ===== Монтажники из 1С: список, вход по PIN (на сайте хранится только хэш) ===== */
var INST_OK=false,LIVE1=/^https?:/.test(location.protocol);
if(LIVE1)INSTALLERS=[];
function lset(){try{return JSON.parse(localStorage.getItem('insts2')||'[]')}catch(e){return[]}}
pins=function(){try{localStorage.setItem('insts2',JSON.stringify(INSTALLERS.map(function(x){var o={id:x.id};['pub','extra','pass','c1'].forEach(function(k){if(x[k]!==undefined)o[k]=x[k]});if(x.id.charAt(0)==='i'){o.name=x.name}return o})))}catch(e){}};
function applyInst(d){var loc={};lset().forEach(function(x){loc[x.id]=x});var pub={};(d.pub||[]).forEach(function(c){pub[c]=1});
 var list=(d.items||[]).map(function(r){var o={id:'c'+r.c,name:r.n,c1:r.c,ph:r.h,pub:!!pub[r.c],extra:0},l=loc[o.id];if(l)['pub','extra','pass'].forEach(function(k){if(l[k]!==undefined)o[k]=l[k]});return o});
 Object.keys(loc).forEach(function(id){var l=loc[id];if(id.charAt(0)==='i'&&l.name)list.push(l)});
 INSTALLERS=list;INST_OK=true;if(me){var m2=INSTALLERS.filter(function(x){return x.id===me.id})[0];if(m2)me=m2}
 if(page==='login'||page==='admin'||page==='insts'||s.inst)render(true)}
if(LIVE1)fetch('installers.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d)applyInst(d);else{INST_OK=true;render(true)}}).catch(function(){INST_OK=true;render(true)});
else INST_OK=true;
var _instList1=instList;instList=function(){return _instList1().filter(function(e){return e.x.pub})};
function sha256hex(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(v){return('0'+v.toString(16)).slice(-2)}).join('')})}
doLogin=function(){var x=INSTALLERS.filter(function(i){return i.id===selI})[0],el=$('lpw'),pw=el?el.value.trim():'';
 var fin=function(ok){if(ok){me=x;defd=40+bonus(x.id);selI=null;lerr='';setMode(true)}else{lerr='Неправильный пароль';render()}};
 if(!x||!pw)return fin(false);if(x.pass)return fin(pw===x.pass);
 if(x.ph&&window.crypto&&crypto.subtle)sha256hex(x.c1+':'+pw).then(function(h){fin(h===x.ph)}).catch(function(){fin(false)});else fin(false)};
function fltList(inp,sel){var q=inp.value.trim().toLowerCase();document.querySelectorAll(sel).forEach(function(c){c.style.display=(!q||(c.dataset.nm||'').indexOf(q)>=0)?(c.classList.contains('acard')?'':'flex'):'none'})}
document.addEventListener('input',function(e){var t=e.target;if(t.id==='lfind')fltList(t,'[data-a=lsel]');if(t.id==='afind')fltList(t,'.acard')});
var _pLogin1=pLogin;
pLogin=function(){if(s.inst||selI)return _pLogin1();
 if(!INST_OK)return `<div class='in'><div class='crumb' data-go='home'>← Главная</div><div class='mut' style='text-align:center;margin:40px 0'>Загружаем список монтажников…</div></div>`;
 return `<div class='in'><div class='crumb' data-go='home'>← Главная</div><div style='max-width:480px;margin:8px auto'><h2 style='margin-bottom:4px'>Кто вы?</h2><p class='mut' style='margin:0 0 12px;font-size:15px'>Найдите своё имя и введите PIN из магазина</p><input type='text' id='lfind' placeholder='🔍 Начните вводить имя' autocomplete='off' style='width:100%;margin-bottom:12px'><div class='col'>${INSTALLERS.map(function(x,i){return `<div class='pc' style='display:flex;flex-direction:row;align-items:center;gap:12px;padding:10px 14px;cursor:pointer' data-a='lsel' data-id='${x.id}' data-nm='${esc(x.name.toLowerCase())}'>${av(x,i,40)}<div style='flex:1;min-width:0'><div class='nm' style='font-size:16px'>${esc(x.name)}</div></div><span class='chev'>›</span></div>`}).join('')||`<div class='mut'>Список пуст</div>`}</div></div></div>`};
PAGES.login=pLogin;
var _admIn1=admIn;
admIn=function(){var h=_admIn1();return h.replace("<div class='col'>","<input type='text' id='afind' placeholder='🔍 Поиск монтажника ("+INSTALLERS.length+")' autocomplete='off' style='width:100%;margin-bottom:10px'><div class='col'>")};
var _admCard2=admCard;
admCard=function(x,i){var h=_admCard2(x,i);
 var tg=`<label class='row' style='gap:8px;margin:0 0 8px;cursor:pointer'><input type='checkbox' data-a='apub' data-id='${x.id}'${x.pub?' checked':''}> Показывать клиентам в разделе «Монтажники»</label>`;
 h=h.replace("<div class='pc' style='cursor:default'>",`<div class='pc acard' style='cursor:default' data-nm='${esc(x.name.toLowerCase())}'>`);
 return h.replace("<div class='dv' style='margin:10px 0'></div>","<div class='dv' style='margin:10px 0'></div>"+tg)};
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.a==='apub'){var x=INSTALLERS.filter(function(q){return q.id===t.dataset.id})[0];if(x){x.pub=t.checked;pins();toast(x.pub?'Показан клиентам':'Скрыт от клиентов')}}});
var _board1=board;board=function(per){return _board1(per).filter(function(r){return r.n>0||r.s>0||(me&&r.x.id===me.id)})};

var h0=location.hash.slice(1);if(h0&&h0!=='order'&&h0!=='done')go(h0,true);else render();
</script>
